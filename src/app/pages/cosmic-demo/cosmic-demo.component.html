<div class="demo-wrapper">
  <nav class="demo-nav">
    <a routerLink="/" class="back-btn">← Back</a>
    <span class="demo-title">🚀 Cosmic Odyssey</span>
    <span class="hint">Move mouse to steer · Scroll for speed</span>
  </nav>
  <div class="hud">
    <div class="hud-item">SPEED <span class="hud-val" id="speedVal">1.0x</span></div>
    <div class="hud-item">SECTOR <span class="hud-val">ANDROMEDA</span></div>
    <div class="hud-item">WARP <span class="hud-val warp-status">ACTIVE</span></div>
  </div>
  <canvas #canvas class="three-canvas"></canvas>
  <div class="cockpit-overlay">
    <div class="cockpit-frame"></div>
    <div class="crosshair"></div>
  </div>
</div>
